# chat-api CI/CD: main push → OIDC AssumeRole → build → ECR push(태그=short SHA) → EKS 롤링 배포
# 계정 ID·ARN 은 코드에 두지 않는다(public repo). 값은 저장소 Variables 에 등록:
#   AWS_ROLE_ARN, AWS_REGION, ECR_REPOSITORY, EKS_CLUSTER_NAME
name: chat-api

on:
  push:
    branches: [main]
    paths:
      - "apps/chat-api/**"
  workflow_dispatch:

# OIDC 토큰 발급(id-token)만 추가 권한. 저장소 내용은 읽기 전용.
permissions:
  id-token: write
  contents: read

# 같은 브랜치에서 배포가 겹치지 않게 직렬화
concurrency:
  group: chat-api-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag (short SHA, no latest)
        id: meta
        run: |
          tag="$(git rev-parse --short=7 HEAD)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker build -t "${IMAGE}" apps/chat-api
          docker push "${IMAGE}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "${EKS_CLUSTER_NAME}" --region "${AWS_REGION}"

      - name: Deploy (rolling update)
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          kubectl -n hermes set image deploy/chat-api chat-api="${IMAGE}"
          kubectl -n hermes rollout status deploy/chat-api --timeout=180s
