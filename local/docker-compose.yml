# 로컬 통합 리허설: C4(chat -> content) + note(Serverless 대체) 전 경로
# 사용: cp .env.example .env && docker compose up -d --build   (local/ 에서)
name: hermes-local
services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hermes}
      MYSQL_USER: ${DB_USER:-hermes_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-dev-pw}
    healthcheck:   # content-api 는 DB healthy 이후에 기동
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
    ports: ["3306:3306"]

  content-api:
    build:
      context: ../apps/content-api
      dockerfile: ../../local/Dockerfile.content
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE:-hermes}
      DB_USER: ${DB_USER:-hermes_admin}
      DB_PASSWORD: ${DB_PASSWORD:-local-dev-pw}   # DB_SECRET_ARN 미설정 -> 로컬 env 경로
      APP_VERSION: local
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["8080:8080"]

  chat-api:
    build: ../apps/chat-api
    environment:
      LLM_PROVIDER: stub
      CONTENT_API_URL: http://content-api:8080
      NOTE_API_URL: http://note-local:9000
      APP_VERSION: local
    depends_on: [content-api, note-local]
    ports: ["8000:8000"]

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]

  note-local:
    build:
      context: .
      dockerfile: Dockerfile.note
      additional_contexts:
        handler: ../apps/note-fn
    environment:
      DDB_ENDPOINT: http://dynamodb-local:8000
      TABLE_NAME: hermes-prd-note-ddb
      AWS_REGION: ap-northeast-2
      # dynamodb-local 용 더미 값. 호스트의 실제 AWS 자격증명이 컨테이너로 새지 않도록 ${} 보간을 쓰지 않는다
      AWS_ACCESS_KEY_ID: fakeLocalKeyId
      AWS_SECRET_ACCESS_KEY: fakeLocalSecret
    restart: always   # ?crash=1 로 죽은 뒤 '새 실행 환경'으로 복구 (Lambda 복구 리허설)
    depends_on: [dynamodb-local]
    ports: ["9000:9000"]
